name: SAARTHI Access CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgrouting/pgrouting:16-3.4-3.4.1
        env:
          POSTGRES_USER: saarthi
          POSTGRES_PASSWORD: saarthi_dev_pw
          POSTGRES_DB: saarthi_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest-cov

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+psycopg2://saarthi:saarthi_dev_pw@localhost:5432/saarthi_test_db
          TEST_DATABASE_URL: postgresql+psycopg2://saarthi:saarthi_dev_pw@localhost:5432/saarthi_test_db
        run: |
          PYTHONPATH=apps/api alembic -c apps/api/alembic.ini upgrade head

      - name: Run Pytest with Coverage
        env:
          DATABASE_URL: postgresql+psycopg2://saarthi:saarthi_dev_pw@localhost:5432/saarthi_test_db
          TEST_DATABASE_URL: postgresql+psycopg2://saarthi:saarthi_dev_pw@localhost:5432/saarthi_test_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          PYTHONPATH=apps/api pytest apps/api/tests -v --cov=app --cov-report=term-missing
