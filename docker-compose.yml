version: '3.8'

services:
  db:
    image: pgrouting/pgrouting:16-3.5-3.8
    container_name: saarthi_db
    restart: always
    environment:
      POSTGRES_USER: saarthi
      POSTGRES_PASSWORD: saarthi_dev_pw
      POSTGRES_DB: saarthi_db
    ports:
      - "5433:5432"
    volumes:
      - saarthi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saarthi -d saarthi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: saarthi_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - saarthi_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: saarthi_minio
    restart: always
    user: root
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - saarthi_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: saarthi_api
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://saarthi:saarthi_dev_pw@db:5432/saarthi_db
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: saarthi_worker
    restart: always
    command: python -m app.workers.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://saarthi:saarthi_dev_pw@db:5432/saarthi_db
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: saarthi_web
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules

volumes:
  saarthi_pgdata:
  saarthi_redisdata:
  saarthi_miniodata:
